[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superfish-ng"
version = "0.1.0"
description = "Independent axisymmetric TM RF cavity research solver"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.24,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7,<4"]

[project.scripts]
superfish-ng = "superfish_ng.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
