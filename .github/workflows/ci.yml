name: physics-and-interface
on:
  push:
    branches: [main, master]
    paths-ignore:
      - README.md
      - AGENTS.md
      - CONTRIBUTING.md
      - docs/TESTING.md
      - docs/PARALLEL_VALIDATION.md
      - docs/BACKLOG.md
      - docs/CODEX_HANDOFF.md
      - docs/PROVENANCE.md
  pull_request:
    paths-ignore:
      - README.md
      - AGENTS.md
      - CONTRIBUTING.md
      - docs/TESTING.md
      - docs/PARALLEL_VALIDATION.md
      - docs/BACKLOG.md
      - docs/CODEX_HANDOFF.md
      - docs/PROVENANCE.md
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python scripts/validate.py --out validation-ci
      - uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.python }}
          path: validation-ci
