name: physics-and-interface
on:
  push:
    branches: [main, master]
    paths-ignore:
      - README.md
      - AGENTS.md
      - CONTRIBUTING.md
      - docs/TESTING.md
      - docs/PARALLEL_VALIDATION.md
      - docs/BACKLOG.md
      - docs/CODEX_HANDOFF.md
      - docs/PROVENANCE.md
  pull_request:
    paths-ignore:
      - README.md
      - AGENTS.md
      - CONTRIBUTING.md
      - docs/TESTING.md
      - docs/PARALLEL_VALIDATION.md
      - docs/BACKLOG.md
      - docs/CODEX_HANDOFF.md
      - docs/PROVENANCE.md
  workflow_dispatch:
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTHONPATH: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.5'
      - run: uv venv --python python
      - run: uv pip install --python .venv/bin/python .
      - run: uv run --no-project --python .venv/bin/python python scripts/check_core_environment.py --out core-ci
      - run: >-
          uv run --no-project --python .venv/bin/python python -m unittest -v
          test_physics.PhysicsTests.test_tm010_frequency
          test_physics.PhysicsTests.test_physical_field_shape_against_bessel_not_only_frequency
          test_physics.PhysicsTests.test_energy_and_mode_orthogonality
          test_physics.PhysicsTests.test_q0_geometry_factor_rq_and_ttf
          test_saved.SavedTests.test_saved_field_consistency_and_corrupt_axis_rejected
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-${{ matrix.python }}
          path: core-ci
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.5'
      - run: uv venv --python python
      - run: uv pip install --python .venv/bin/python '.[plot]'
      - run: uv run --no-project --python .venv/bin/python python scripts/validate.py --out validation-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.python }}
          path: validation-ci
